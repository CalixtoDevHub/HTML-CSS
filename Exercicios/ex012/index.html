<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vídeos com Html</title>
  </head>
  <body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo hospedado no meu próprio servidor.</p>

    <video controls width="560" poster="imagens/images.jpg" loop>
      <source src="midia/meu-video.mp4" type="video/mp4" />
      <source src="midia/Meu-Video.webm.webm" type="video/webm" />
      <p>seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>

    <h1> Inserindo vídeos do Youtube</h1>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=5hhaQWcddv_mSjDo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <!--Recomendado hospedar vídeos do YOUTUBE para não gastar, porem o video fica em publico para todos verem;
    existe outro site de vídeos para vc poder hospedar e colocar 'privado'o site é o VIMEO (é pago)
    -->
    
    
    
    <!--ATENÇÃO-->
    <!--Os videos deverão ser baixados em todas as versoes pq o navegador irá reproduzir qual ele está apto, ex: navegador Safari é reproduzido no Iphone-->

    <!--Os videos feitos dessa forma localmente normalmente consomem mais memorias do site mais gigas para o cliente.sempre deixar avisado sobre.-->
  </body>
</html>
