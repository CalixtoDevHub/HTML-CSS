<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em Html</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e dimunua o tamanho do seu navegador.</p>
                <!--ATENÇAO-->
    <!--Sempre utilizar a ordem correta das midias utulizando primeira a pequena a media e a grande! Se não ele não irá funcionar.-->

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset=" imagens/foto-m.png"
        type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo Audio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
   <audio preload="metadata" autoplay controls>
    <source src="midia/happy-mistake.mp3" type="audio/mepg">
    <source src="midia/happy-mistake.ogg" type="audio/ogg">
    <source src="midia/happy-mistake.waw" type="audio/waw">
    <p>Infelizmente seu navegador não consegue reproduzir áudio.<a href="midia/happy-mistake.mp3.mp3">Clique aqui para baixar o arquivo MP3</a></p>

   </audio>
    <!--NÃO USA O WAW PQ É MUITO PESADO-->
    <!--MP3 WAW OGG são modos reprodutores dos audios-->
    


    

    
</body>
</html>
