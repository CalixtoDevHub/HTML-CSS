<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabelas 02</title>
    <style>
        body {
           font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
            
        }
         td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }
        
    </style> 
</head>
<body>
    <table>
        <tr>
            <td colspan="4" rowspan="2">A</td>
            <td rowspan="3">C</td>
        </tr>
        <tr></tr>
        <tr>
            <td rowspan="2">D</td>
            <td>E</td>
            <td>F</td>
            <td rowspan="2">N</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
            <td rowspan="2">B</td>
            
        </tr>
           
       
           
    
</body>
</html>
